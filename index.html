<!DOCTYPE html>
<html>
<head>
  <title>Letter Generator</title>
  <style>
    body { font-family: "Times New Roman", Times, Georgia, serif; text-align: center; margin: 20px; }
    #preview {
      position: relative;
      width: 680px; 
      height: 1000px;
      background-image: url(backround.jpg); 
      background-size: contain;
      margin: auto;
      border: 1px solid #ccc;
    }
    #text {
      position: absolute;
      top: 200px; left: 180px;
      height: fit-content;
      max-height: 600px;
      width: 500px;
      font-size: 16px;
      text-align: left;
      white-space: pre-wrap;
      transition: font-size 0.3s ease;
    }
    #signature {
      position: absolute;
      left: 180px;
      width: 280px;
    }
    #additionalText {
      position: absolute;
      top: 200px; left: 180px;
      width: 500px;
      font-size: 16px;
      text-align: left;
      white-space: pre-wrap;
      transition: font-size 0.3s ease;
    }
    #date{
      position: absolute;
      top: 142px; left: 558px;
      width: 500px;
      font-size: 13px;
      text-align: left;
      white-space: pre-wrap;
    }
    #Number{
      position: absolute;
      top: 103px; left: 580px;
      width: 500px;
      font-size: 13px;
      text-align: left;
      white-space: pre-wrap;
    }
    .ios-instructions {
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      display: none;
    }
    .page {
  position: relative;
  width: 680px;
  height: 1000px;
  background-image: url(backround.jpg);
  background-size: contain;
  margin: 20px auto;
  border: 1px solid #ccc;
}

  </style>
</head>
<body>
  <h2>CRSA Letter Generator</h2>
  <div style="display:flex; justify-content:space-around; margin-bottom:10px; align-items: center;">
    <textarea id="input" rows="6" cols="60" placeholder="Paste text here..."></textarea>
    <textarea id="numberInput" rows="2" cols="30" placeholder="Enter number here..."></textarea>
    <div id="roleSelection" style="display:flex; flex-direction: column; justify-content: center; margin-left: 20px; text-align: left;">
      <label><input type="radio" name="role" value="President" checked> President</label>
      <label><input type="radio" name="role" value="General Secretary"> General Secretary</label>
      <label style="margin-top: 10px;">
  <input type="checkbox" id="includeSignature" checked>
  Include Signature
</label>
    </div>
  </div>
  <button onclick="updateText()">Update Preview</button>
  <button onclick="download()">Download as Image</button>
  <button onclick="downloadPDF()">Download as PDF</button>
  <button onclick="addPage()">Add Another Page</button>
  <label for="pageSelect">Select Page:</label>
<select id="pageSelect" onchange="setActivePage(this.value)">
  <option value="1" selected>Page 1</option>
</select>


  
  <div id="iosInstructions" class="ios-instructions">
    <strong>iOS Users:</strong> If PDF opens in Safari instead of downloading, tap the <strong>Share button</strong> and select <strong>"Save to Files"</strong> or <strong>"Save PDF to Books"</strong> to save it to your device.
  </div>

  <div id="pagesContainer">
    <div class="page" id="preview">

    <div id="text"></div>
    <img id="signature" src="sign.png">
    <div id="additionalText">Maninderjit Singh Sidhu
President 
Chandigarh Roller Skating Association</div>
    <div id="date"></div>
    <div id="Number"></div>
    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    // Detect iOS device
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Show iOS instructions if on iOS device
    if (isIOS()) {
      document.getElementById('iosInstructions').style.display = 'block';
    }

    function updateText() {
  const previewDiv = document.getElementById('preview');
  if (!previewDiv) return;

  const textDiv = previewDiv.querySelector('#text');
  const signatureImg = previewDiv.querySelector('#signature');
  const additionalTextDiv = previewDiv.querySelector('#additionalText');
  const numberDiv = previewDiv.querySelector('#Number');
  const dateDiv = previewDiv.querySelector('#date');

  // Update text and number
  textDiv.innerText = document.getElementById('input').value;
  numberDiv.innerText = document.getElementById('numberInput').value;

  // Update date if empty
  if (!dateDiv.innerText.trim()) {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const yyyy = today.getFullYear();
    dateDiv.innerText = `${dd}/${mm}/${yyyy}`;
  }

  // Include/exclude signature
  const includeSignature = document.getElementById('includeSignature').checked;
  const roleRadios = document.getElementsByName('role');
  let selectedRole = 'President';
  for (const radio of roleRadios) {
    if (radio.checked) selectedRole = radio.value;
  }

  if (includeSignature) {
    signatureImg.style.display = 'block';
    if (selectedRole === 'President') {
      additionalTextDiv.style.display = 'block';
      additionalTextDiv.innerHTML = `Maninderjit Singh Sidhu<br>President<br>Chandigarh Roller Skating Association`;
      signatureImg.src = 'sign.png';
    } else if (selectedRole === 'General Secretary') {
      additionalTextDiv.style.display = 'none';
      signatureImg.src = 'sign2.png';
    }
  } else {
    signatureImg.style.display = 'none';
    additionalTextDiv.style.display = 'none';
  }

  // Font size handling
  let fontSize = 16;
  textDiv.style.fontSize = fontSize + 'px';
  while (textDiv.scrollHeight > 600 && fontSize > 12) {
    fontSize -= 1;
    textDiv.style.fontSize = fontSize + 'px';
    additionalTextDiv.style.fontSize = fontSize + 'px';
  }

  signatureImg.style.width = (fontSize === 12 ? '224px' : '280px');

  // Position elements
  const textRect = textDiv.getBoundingClientRect();
  const previewRect = previewDiv.getBoundingClientRect();
  let signatureTop = textRect.bottom - previewRect.top + 10;
  const maxSignatureTop = previewDiv.clientHeight - signatureImg.clientHeight - 70;
  if (signatureTop > maxSignatureTop) signatureTop = maxSignatureTop;
  signatureImg.style.top = signatureTop + 'px';

  let additionalTextTop = signatureTop + signatureImg.clientHeight;
  const maxAdditionalTextTop = previewDiv.clientHeight - additionalTextDiv.clientHeight;
  if (additionalTextTop > maxAdditionalTextTop) additionalTextTop = maxAdditionalTextTop;
  additionalTextDiv.style.top = additionalTextTop + 'px';
}


 let currentPageIndex = 0;

function addPage() {
  const pagesContainer = document.getElementById('pagesContainer') || createPagesContainer();
  const firstPage = document.getElementById('preview');
  const newPage = firstPage.cloneNode(true);

  // assign a unique id
  const newPageIndex = document.querySelectorAll('.page').length;
  newPage.id = 'preview' + (newPageIndex + 1);
  newPage.classList.add('page');

  // reset content
  newPage.querySelector('#text').innerText = '';
  newPage.querySelector('#Number').innerText = '';
  newPage.querySelector('#date').innerText = document.getElementById('date').innerText;

  // append
  pagesContainer.appendChild(newPage);

  // update selector
  const pageSelect = document.getElementById('pageSelect');
  const option = document.createElement('option');
  option.value = newPageIndex + 1;
  option.text = 'Page ' + (newPageIndex + 1);
  pageSelect.appendChild(option);
  pageSelect.value = newPageIndex + 1;
  setActivePage(pageSelect.value);

  alert(`Page ${newPageIndex + 1} added!`);
}

function createPagesContainer() {
  const container = document.createElement('div');
  container.id = 'pagesContainer';
  document.getElementById('preview').before(container);
  container.appendChild(document.getElementById('preview'));
  return container;
}

function setActivePage(index) {
  currentPageIndex = parseInt(index) - 1;
  const allPages = document.querySelectorAll('.page');
  allPages.forEach((page, i) => {
    page.style.border = i === currentPageIndex ? '3px solid #007BFF' : '1px solid #ccc';
  });

  // Temporarily switch the IDs used by updateText()
  const active = allPages[currentPageIndex];
  if (!active) return;

  // Reset any previous main preview id
  allPages.forEach(p => {
    if (p.id.startsWith('preview')) p.id = 'preview' + (Array.from(allPages).indexOf(p) + 1);
  });

  // Rename the active one back to "preview"
  active.id = 'preview';

  // Now when updateText() runs, it modifies only this active page
}



    function download() {
      html2canvas(document.getElementById('preview')).then(canvas => {
        let link = document.createElement('a');
        link.download = 'letter.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    window.onload = function() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const formattedDate = dd + '/' + mm + '/' + yyyy;
      document.getElementById('date').innerText = formattedDate;
    };

    function downloadPDF() {
  const pages = document.querySelectorAll('.page');

  const { jsPDF } = window.jspdf;
  let pdf;

  let processPage = (i) => {
    if (i >= pages.length) {
      // All pages processed
      if (isIOS()) {
        const pdfBlob = pdf.output('blob');
        const pdfUrl = URL.createObjectURL(pdfBlob);
        const link = document.createElement('a');
        link.href = pdfUrl;
        link.download = 'letter.pdf';
        link.target = '_blank';
        link.setAttribute('rel', 'noopener');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => {
          alert('iOS Note: If the PDF opens in Safari, tap the Share button (box with arrow) and select "Save to Files" or "Save PDF to Books" to download it to your device.');
        }, 500);
      } else {
        pdf.save('letter.pdf');
      }
      return;
    }

    html2canvas(pages[i], { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      const imgWidth = canvas.width;
      const imgHeight = canvas.height;

      if (i === 0) {
        pdf = new jsPDF({
          orientation: imgWidth > imgHeight ? 'landscape' : 'portrait',
          unit: 'px',
          format: [imgWidth, imgHeight]
        });
      }

      pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);

      if (i < pages.length - 1) pdf.addPage([imgWidth, imgHeight]);

      processPage(i + 1);
    }).catch(error => {
      console.error('Error generating page PDF:', error);
      alert('Error generating PDF. Please try again.');
    });
  };

  processPage(0);
  }
  // --- LIVE UPDATE TRIGGERS ---

// Detect typing or changes
document.addEventListener("DOMContentLoaded", function() {
  const textArea = document.getElementById("input");
  const numberInput = document.getElementById("numberInput");
  const roleRadios = document.getElementsByName("role");
  const includeSignature = document.getElementById("includeSignature");

  // Call updateText() instantly on input
  textArea.addEventListener("input", updateText);
  numberInput.addEventListener("input", updateText);
  includeSignature.addEventListener("change", updateText);

  // Radio buttons
  roleRadios.forEach(radio => {
    radio.addEventListener("change", updateText);
  });

  // Also call updateText() when changing page
  const pageSelect = document.getElementById("pageSelect");
  if (pageSelect) {
    pageSelect.addEventListener("change", updateText);
  }
});

  </script>
</body>
</html>
