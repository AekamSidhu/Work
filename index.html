<!DOCTYPE html>
<html>
<head>
  <title>Letter Generator</title>
  <style>
    body { font-family: "Times New Roman", Times, Georgia, serif; text-align: center; margin: 20px; }
    #preview {
      position: relative;
      width: 680px; 
      height: 1000px;
      background-image: url(backround.jpg); 
      background-size: contain;
      margin: auto;
      border: 1px solid #ccc;
    }
    #text {
      position: absolute;
      top: 200px; left: 180px;
      height: fit-content;
      max-height: 600px;
      width: 500px;
      font-size: 16px;
      text-align: left;
      white-space: pre-wrap;
      transition: font-size 0.3s ease;
    }
    #signature {
      position: absolute;
      left: 180px;
      width: 280px;
    }
    #additionalText {
      position: absolute;
      top: 200px; left: 180px;
      width: 500px;
      font-size: 16px;
      text-align: left;
      white-space: pre-wrap;
      transition: font-size 0.3s ease;
    }
    #date{
      position: absolute;
      top: 142px; left: 558px;
      width: 500px;
      font-size: 13px;
      text-align: left;
      white-space: pre-wrap;
    }
    #Number{
      position: absolute;
      top: 103px; left: 580px;
      width: 500px;
      font-size: 13px;
      text-align: left;
      white-space: pre-wrap;
    }
    .ios-instructions {
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>CRSA Letter Generator</h2>
  <div style="display:flex; justify-content:space-around; margin-bottom:10px; align-items: center;">
    <textarea id="input" rows="6" cols="60" placeholder="Paste text here..."></textarea>
    <textarea id="numberInput" rows="2" cols="30" placeholder="Enter number here..."></textarea>
    <div id="roleSelection" style="display:flex; flex-direction: column; justify-content: center; margin-left: 20px; text-align: left;">
      <label><input type="radio" name="role" value="President" checked> President</label>
      <label><input type="radio" name="role" value="General Secretary"> General Secretary</label>
    </div>
  </div>
  <button onclick="updateText()">Update Preview</button>
  <button onclick="download()">Download as Image</button>
  <button onclick="downloadPDF()">Download as PDF</button>
  
  <div id="iosInstructions" class="ios-instructions">
    <strong>iOS Users:</strong> If PDF opens in Safari instead of downloading, tap the <strong>Share button</strong> and select <strong>"Save to Files"</strong> or <strong>"Save PDF to Books"</strong> to save it to your device.
  </div>

  <div id="preview">
    <div id="text"></div>
    <img id="signature" src="sign.png">
    <div id="additionalText">Maninderjit Singh Sidhu
President 
Chandigarh Roller Skating Association</div>
    <div id="date"></div>
    <div id="Number"></div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    // Detect iOS device
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Show iOS instructions if on iOS device
    if (isIOS()) {
      document.getElementById('iosInstructions').style.display = 'block';
    }

    function updateText() {
      const textDiv = document.getElementById('text');
      const signatureImg = document.getElementById('signature');
    const additionalTextDiv = document.getElementById('additionalText');
    const previewDiv = document.getElementById('preview');

    // Update the text content
    textDiv.innerText = document.getElementById('input').value;

    // Update the number content
    const numberDiv = document.getElementById('Number');
    numberDiv.innerText = document.getElementById('numberInput').value;

    // Update the additionalText role based on selected radio button
    const roleRadios = document.getElementsByName('role');
    let selectedRole = 'President';
    for (const radio of roleRadios) {
      if (radio.checked) {
        selectedRole = radio.value;
        break;
      }
    }
    if (selectedRole === 'President') {
      additionalTextDiv.style.display = 'block';
      additionalTextDiv.innerHTML = `Maninderjit Singh Sidhu<br>President<br>Chandigarh Roller Skating Association`;
      signatureImg.src = 'sign.png';
    } else if (selectedRole === 'General Secretary') {
      additionalTextDiv.style.display = 'none';
      signatureImg.src = 'sign2.png';
    }

    // Reset font size to default before measuring
    const defaultFontSize = 16;
    let fontSize = defaultFontSize;
    textDiv.style.fontSize = fontSize + 'px';

    // Reduce font size if text overflows max height
    while (textDiv.scrollHeight > 600 && fontSize > 13) {
      fontSize -= 1;
      textDiv.style.fontSize = fontSize + 'px';
      additionalTextDiv.style.fontSize = fontSize + 'px';
    }

    // Calculate the bottom position of the text relative to preview
    const textRect = textDiv.getBoundingClientRect();
    const previewRect = previewDiv.getBoundingClientRect();

    // Calculate top position for signature: 20px below text bottom, relative to preview top
    let signatureTop = textRect.bottom - previewRect.top + 10;

    // Ensure signature stays within preview height
    const maxSignatureTop = previewDiv.clientHeight - signatureImg.clientHeight - 70;
    if (signatureTop > maxSignatureTop) {
      signatureTop = maxSignatureTop;
    }

    // Set the top position of the signature image
    signatureImg.style.top = signatureTop + 'px';

    // Calculate top position for additionalText: 50px below signature bottom
    let additionalTextTop = signatureTop + signatureImg.clientHeight;

    // Ensure additionalText stays within preview height
    const maxAdditionalTextTop = previewDiv.clientHeight - additionalTextDiv.clientHeight;
    if (additionalTextTop > maxAdditionalTextTop) {
      additionalTextTop = maxAdditionalTextTop;
    }

    // Set the top position of the additional text box
    additionalTextDiv.style.top = additionalTextTop + 'px';
    }

    function download() {
      html2canvas(document.getElementById('preview')).then(canvas => {
        let link = document.createElement('a');
        link.download = 'letter.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    window.onload = function() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const formattedDate = dd + '/' + mm + '/' + yyyy;
      document.getElementById('date').innerText = formattedDate;
    };

    function downloadPDF() {
      html2canvas(document.getElementById('preview'), {
        scale: 2,
        useCORS: true,
        allowTaint: true
      }).then(canvas => {
        const imgData = canvas.toDataURL('image/jpeg', 1.0);
        const imgWidth = canvas.width;
        const imgHeight = canvas.height;
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: imgWidth > imgHeight ? 'landscape' : 'portrait',
          unit: 'px',
          format: [imgWidth, imgHeight]
        });
        
        pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
        
        if (isIOS()) {
          // For iOS: Open PDF in new tab with special handling
          const pdfBlob = pdf.output('blob');
          const pdfUrl = URL.createObjectURL(pdfBlob);
          
          // Try to force download with special filename
          const link = document.createElement('a');
          link.href = pdfUrl;
          link.download = 'letter.pdf';
          link.target = '_blank';
          
          // Add iOS-specific attributes
          link.setAttribute('rel', 'noopener');
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          // Show user instructions for iOS
          setTimeout(() => {
            alert('iOS Note: If the PDF opens in Safari, tap the Share button (box with arrow) and select "Save to Files" or "Save PDF to Books" to download it to your device.');
          }, 500);
          
        } else {
          // For other devices: Standard download
          pdf.save('letter.pdf');
        }
        
      }).catch(error => {
        console.error('Error generating PDF:', error);
        alert('Error generating PDF. Please try again.');
      });
    }
  </script>
</body>
</html>
